<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF8F0"/>
      <stop offset="100%" stop-color="#F0E6D6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A036"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- Status bar -->
  <text x="20" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1C1917">9:41</text>
  <rect x="340" y="18" width="16" height="8" rx="2" fill="none" stroke="#1C1917" stroke-width="0.6"/>
  <rect x="341" y="19" width="5" height="6" rx="1" fill="#1C1917"/>
  <rect x="354" y="19" width="8" height="6" rx="2" fill="#1C1917" opacity="0.4"/>
  <circle cx="330" cy="22" r="2.5" fill="#1C1917" opacity="0.4"/>

  <!-- Header -->
  <rect x="0" y="40" width="390" height="50" fill="#FDF8F0"/>
  <rect x="16" y="48" width="32" height="32" rx="8" fill="url(#gold)"/>
  <text x="32" y="69" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#FFF" text-anchor="middle">B</text>
  <text x="56" y="68" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1C1917">Biblia-Quiz</text>
  <text x="56" y="82" font-family="Inter, sans-serif" font-size="7" fill="#A38A5C">TESTEZ VOS CONNAISSANCES</text>

  <!-- Hero -->
  <rect x="120" y="100" width="150" height="22" rx="11" fill="#D4A036" opacity="0.12"/>
  <text x="195" y="115" font-family="Inter, sans-serif" font-size="9" fill="#D4A036" text-anchor="middle" font-weight="500">Testez vos connaissances bibliques</text>
  <text x="195" y="152" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1C1917" text-anchor="middle">Biblia-Quiz</text>
  <text x="195" y="180" font-family="Inter, sans-serif" font-size="12" fill="#78716C" text-anchor="middle">Explorez la Bible à travers des quiz</text>
  <text x="195" y="196" font-family="Inter, sans-serif" font-size="12" fill="#78716C" text-anchor="middle">sur l'Ancien et le Nouveau Testament</text>

  <!-- Categories -->
  <g transform="translate(16, 220)">
    <rect x="0" y="0" width="174" height="80" rx="12" fill="#FFF" opacity="0.8"/>
    <text x="14" y="28" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1C1917">📖 Ancien Testament</text>
    <text x="14" y="50" font-family="Inter, sans-serif" font-size="9" fill="#78716C">Genèse, Exode, Lévitique...</text>
    <text x="14" y="66" font-family="Inter, sans-serif" font-size="8" fill="#D4A036" font-weight="600">36 questions →</text>

    <rect x="184" y="0" width="174" height="80" rx="12" fill="#FFF" opacity="0.8"/>
    <text x="198" y="28" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1C1917">📜 Nouveau Testament</text>
    <text x="198" y="50" font-family="Inter, sans-serif" font-size="9" fill="#78716C">Matthieu, Marc, Luc...</text>
    <text x="198" y="66" font-family="Inter, sans-serif" font-size="8" fill="#D4A036" font-weight="600">36 questions →</text>

    <rect x="0" y="92" width="174" height="80" rx="12" fill="#FFF" opacity="0.8"/>
    <text x="14" y="120" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1C1917">👤 Personnages</text>
    <text x="14" y="142" font-family="Inter, sans-serif" font-size="9" fill="#78716C">Abraham, Moïse, David...</text>
    <text x="14" y="158" font-family="Inter, sans-serif" font-size="8" fill="#D4A036" font-weight="600">36 questions →</text>

    <rect x="184" y="92" width="174" height="80" rx="12" fill="#FFF" opacity="0.8"/>
    <text x="198" y="120" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1C1917">🔥 Prophètes</text>
    <text x="198" y="142" font-family="Inter, sans-serif" font-size="9" fill="#78716C">Ésaïe, Jérémie, Ézéchiel...</text>
    <text x="198" y="158" font-family="Inter, sans-serif" font-size="8" fill="#D4A036" font-weight="600">36 questions →</text>

    <rect x="0" y="184" width="174" height="80" rx="12" fill="#FFF" opacity="0.8"/>
    <text x="14" y="212" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1C1917">🏛️ Vie Sociale Juive</text>
    <text x="14" y="234" font-family="Inter, sans-serif" font-size="9" fill="#78716C">Coutumes et traditions</text>
    <text x="14" y="250" font-family="Inter, sans-serif" font-size="8" fill="#D4A036" font-weight="600">36 questions →</text>

    <rect x="184" y="184" width="174" height="80" rx="12" fill="#FFF" opacity="0.8"/>
    <text x="198" y="212" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1C1917">📖 Noms de Dieu</text>
    <text x="198" y="234" font-family="Inter, sans-serif" font-size="9" fill="#78716C">Les noms divins</text>
    <text x="198" y="250" font-family="Inter, sans-serif" font-size="8" fill="#D4A036" font-weight="600">36 questions →</text>
  </g>

  <!-- Stats -->
  <g transform="translate(40, 588)">
    <text x="45" y="20" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#D4A036" text-anchor="middle">7</text>
    <text x="45" y="36" font-family="Inter, sans-serif" font-size="9" fill="#78716C" text-anchor="middle">Catégories</text>
    <text x="155" y="20" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#D4A036" text-anchor="middle">1365</text>
    <text x="155" y="36" font-family="Inter, sans-serif" font-size="9" fill="#78716C" text-anchor="middle">Questions</text>
    <text x="265" y="20" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#D4A036" text-anchor="middle">∞</text>
    <text x="265" y="36" font-family="Inter, sans-serif" font-size="9" fill="#78716C" text-anchor="middle">Sagesse</text>
  </g>

  <!-- Bottom nav -->
  <rect x="0" y="780" width="390" height="64" fill="#FDF8F0"/>
  <line x1="0" y1="780" x2="390" y2="780" stroke="#E8DDD0" stroke-width="0.5"/>
  <g font-family="Inter, sans-serif" font-size="9" fill="#78716C" text-anchor="middle">
    <text x="45" y="825" fill="#D4A036" font-weight="600">Accueil</text>
    <text x="120" y="825">Cartes</text>
    <text x="195" y="825">Noms</text>
    <text x="270" y="825">Scores</text>
    <text x="345" y="825">Réglages</text>
  </g>
  <circle cx="45" cy="810" r="3" fill="#D4A036"/>
  <circle cx="120" cy="810" r="3" fill="#D4D0C8"/>
  <circle cx="195" cy="810" r="3" fill="#D4D0C8"/>
  <circle cx="270" cy="810" r="3" fill="#D4D0C8"/>
  <circle cx="345" cy="810" r="3" fill="#D4D0C8"/>

  <!-- Home indicator -->
  <rect x="130" y="830" width="130" height="4" rx="2" fill="#D4D0C8"/>
</svg>
