<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF8F0"/>
      <stop offset="50%" stop-color="#F5E6CC"/>
      <stop offset="100%" stop-color="#E8D5B5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A036"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAF5"/>
    </linearGradient>
    <linearGradient id="mockupBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#B8860B" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <clipPath id="phoneClip">
      <rect x="0" y="0" width="195" height="380" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="80" r="180" fill="#D4A036" opacity="0.06"/>
  <circle cx="120" cy="420" r="140" fill="#D4A036" opacity="0.05"/>
  <circle cx="500" cy="250" r="250" fill="#D4A036" opacity="0.03"/>

  <!-- ===== LEFT: Text & Logo ===== -->
  <g transform="translate(50, 0)">
    <!-- Logo icon -->
    <rect x="0" y="65" width="48" height="48" rx="12" fill="url(#gold)"/>
    <text x="24" y="97" font-family="serif" font-size="24" font-weight="bold" fill="#FFF" text-anchor="middle">B</text>

    <!-- App name -->
    <text x="60" y="88" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="bold" fill="#1C1917" letter-spacing="1">Biblia-Quiz</text>
    <text x="60" y="108" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#A38A5C" letter-spacing="3" text-transform="uppercase">Testez vos connaissances</text>

    <!-- Tagline -->
    <text x="0" y="155" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#292524" letter-spacing="0.5">
      La Bible à portée
    </text>
    <text x="0" y="188" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#292524" letter-spacing="0.5">
      de main
    </text>
    <text x="0" y="218" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#78716C" max-width="320">
      Explorez l'Ancien et le Nouveau Testament à travers des quiz interactifs captivants.
    </text>

    <!-- Stats -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="95" height="70" rx="12" fill="#FFF" opacity="0.7" filter="url(#shadow2)"/>
      <text x="47.5" y="30" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#D4A036" text-anchor="middle">7</text>
      <text x="47.5" y="52" font-family="'Inter', Arial, sans-serif" font-size="10" fill="#78716C" text-anchor="middle">Catégories</text>

      <rect x="105" y="0" width="95" height="70" rx="12" fill="#FFF" opacity="0.7" filter="url(#shadow2)"/>
      <text x="152.5" y="30" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#D4A036" text-anchor="middle">1365+</text>
      <text x="152.5" y="52" font-family="'Inter', Arial, sans-serif" font-size="10" fill="#78716C" text-anchor="middle">Questions</text>

      <rect x="210" y="0" width="95" height="70" rx="12" fill="#FFF" opacity="0.7" filter="url(#shadow2)"/>
      <text x="257.5" y="30" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#D4A036" text-anchor="middle">∞</text>
      <text x="257.5" y="52" font-family="'Inter', Arial, sans-serif" font-size="10" fill="#78716C" text-anchor="middle">Sagesse</text>
    </g>
  </g>

  <!-- ===== RIGHT: Phone Mockups ===== -->

  <!-- Phone 1 (center, larger) -->
  <g transform="translate(560, 55)" filter="url(#shadow1)">
    <rect x="0" y="0" width="210" height="410" rx="24" fill="#1C1917"/>
    <!-- Screen -->
    <rect x="5" y="5" width="200" height="400" rx="20" fill="url(#mockupBg)"/>
    <!-- Status bar -->
    <rect x="5" y="5" width="200" height="28" rx="20" fill="#292524"/>
    <circle cx="22" cy="19" r="4" fill="#FFF" opacity="0.8"/>
    <rect x="70" y="16" width="60" height="4" rx="2" fill="#FFF" opacity="0.3"/>
    <!-- App header -->
    <rect x="5" y="33" width="200" height="44" rx="0" fill="#292524"/>
    <rect x="20" y="42" width="28" height="28" rx="7" fill="url(#gold)"/>
    <text x="34" y="61" font-family="serif" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">B</text>
    <text x="55" y="62" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFF">Biblia-Quiz</text>
    <!-- Search bar -->
    <rect x="15" y="87" width="180" height="32" rx="16" fill="#3A3735"/>
    <text x="30" y="107" font-family="'Inter', Arial, sans-serif" font-size="9" fill="#78716C">Rechercher...</text>
    <!-- Category cards -->
    <rect x="15" y="130" width="180" height="50" rx="8" fill="#3A3735"/>
    <text x="28" y="152" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFF">Ancien Testament</text>
    <text x="28" y="168" font-family="'Inter', Arial, sans-serif" font-size="8" fill="#A8A29E">Genèse • Exode • Lévitique</text>
    <line x1="165" y1="145" x2="165" y2="165" stroke="#D4A036" stroke-width="2" stroke-linecap="round"/>

    <rect x="15" y="188" width="180" height="50" rx="8" fill="#3A3735"/>
    <text x="28" y="210" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFF">Nouveau Testament</text>
    <text x="28" y="226" font-family="'Inter', Arial, sans-serif" font-size="8" fill="#A8A29E">Matthieu • Marc • Luc • Jean</text>
    <line x1="165" y1="213" x2="165" y2="233" stroke="#D4A036" stroke-width="2" stroke-linecap="round"/>

    <rect x="15" y="246" width="180" height="50" rx="8" fill="#3A3735"/>
    <text x="28" y="268" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFF">Personnages bibliques</text>
    <text x="28" y="284" font-family="'Inter', Arial, sans-serif" font-size="8" fill="#A8A29E">Abraham • Moïse • David</text>
    <line x1="165" y1="271" x2="165" y2="291" stroke="#D4A036" stroke-width="2" stroke-linecap="round"/>

    <rect x="15" y="304" width="180" height="50" rx="8" fill="#3A3735"/>
    <text x="28" y="326" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFF">Prophètes</text>
    <text x="28" y="342" font-family="'Inter', Arial, sans-serif" font-size="8" fill="#A8A29E">Ésaïe • Jérémie • Ézéchiel</text>
    <line x1="165" y1="329" x2="165" y2="349" stroke="#D4A036" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom nav -->
    <rect x="5" y="368" width="200" height="37" rx="0" fill="#292524"/>
    <circle cx="30" cy="386" r="4" fill="#D4A036"/>
    <circle cx="75" cy="386" r="4" fill="#78716C" opacity="0.5"/>
    <circle cx="120" cy="386" r="4" fill="#78716C" opacity="0.5"/>
    <circle cx="165" cy="386" r="4" fill="#78716C" opacity="0.5"/>
  </g>

  <!-- Phone 2 (smaller, behind, left) -->
  <g transform="translate(480, 130) rotate(-8)" filter="url(#shadow2)" opacity="0.6">
    <rect x="0" y="0" width="150" height="290" rx="18" fill="#1C1917"/>
    <rect x="4" y="4" width="142" height="282" rx="15" fill="#292524"/>
    <!-- Simplified content -->
    <rect x="10" y="40" width="128" height="20" rx="10" fill="#D4A036"/>
    <rect x="10" y="68" width="128" height="8" rx="4" fill="#FFF" opacity="0.15"/>
    <rect x="10" y="82" width="100" height="6" rx="3" fill="#FFF" opacity="0.1"/>
    <rect x="10" y="100" width="128" height="30" rx="6" fill="#3A3735"/>
    <rect x="10" y="138" width="128" height="30" rx="6" fill="#3A3735"/>
    <rect x="10" y="176" width="128" height="30" rx="6" fill="#3A3735"/>
  </g>

  <!-- Decorative star/sparkle elements -->
  <g opacity="0.15">
    <text x="520" y="420" font-family="serif" font-size="16" fill="#D4A036">✦</text>
    <text x="450" y="80" font-family="serif" font-size="10" fill="#D4A036">✦</text>
    <text x="750" y="480" font-family="serif" font-size="12" fill="#D4A036">✦</text>
    <text x="380" y="300" font-family="serif" font-size="8" fill="#D4A036">✦</text>
  </g>

  <!-- Download badges placeholder -->
  <g transform="translate(50, 395)">
    <text x="0" y="10" font-family="'Inter', Arial, sans-serif" font-size="10" fill="#A38A5C" letter-spacing="2">BIENTÔT DISPONIBLE</text>
    <rect x="0" y="22" width="120" height="36" rx="8" fill="#1C1917" opacity="0.85"/>
    <text x="10" y="36" font-family="'Inter', Arial, sans-serif" font-size="6" fill="#A8A29E">Télécharger sur</text>
    <text x="10" y="50" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFF">App Store</text>
    <rect x="130" y="22" width="130" height="36" rx="8" fill="#1C1917" opacity="0.85"/>
    <text x="140" y="36" font-family="'Inter', Arial, sans-serif" font-size="6" fill="#A8A29E">Télécharger sur</text>
    <text x="140" y="50" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFF">Google Play</text>
  </g>
</svg>
