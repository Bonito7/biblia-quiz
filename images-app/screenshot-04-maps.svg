<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF8F0"/>
      <stop offset="100%" stop-color="#F0E6D6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A036"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFDBFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D4A036"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- Status bar -->
  <text x="20" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1C1917">9:41</text>
  <rect x="340" y="18" width="16" height="8" rx="2" fill="none" stroke="#1C1917" stroke-width="0.6"/>
  <rect x="341" y="19" width="5" height="6" rx="1" fill="#1C1917"/>
  <rect x="354" y="19" width="8" height="6" rx="2" fill="#1C1917" opacity="0.4"/>
  <circle cx="330" cy="22" r="2.5" fill="#1C1917" opacity="0.4"/>

  <!-- Header -->
  <rect x="0" y="40" width="390" height="50" fill="#FDF8F0"/>
  <text x="48" y="70" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1C1917">🗺️ Cartes bibliques</text>

  <!-- Map area -->
  <rect x="16" y="100" width="358" height="260" rx="16" fill="#E8DDD0"/>
  <rect x="16" y="100" width="358" height="260" rx="16" fill="#BFDBFE" opacity="0.3"/>

  <!-- Simplified map of Israel -->
  <!-- Sea -->
  <rect x="80" y="150" width="230" height="180" rx="8" fill="#93C5FD" opacity="0.4"/>
  <!-- Land mass -->
  <path d="M100,160 L250,160 L280,200 L260,300 L140,310 L100,270 Z" fill="#FDE68A" opacity="0.6"/>
  <!-- Mediterranean -->
  <text x="60" y="240" font-family="Inter, sans-serif" font-size="8" fill="#60A5FA" opacity="0.6" transform="rotate(-90,60,240)">Mer Méditerranée</text>
  <!-- Dead Sea -->
  <ellipse cx="160" cy="310" rx="30" ry="6" fill="#3B82F6" opacity="0.3"/>
  <text x="160" y="324" font-family="Inter, sans-serif" font-size="7" fill="#3B82F6" text-anchor="middle" opacity="0.6">Mer Morte</text>
  <!-- Cities -->
  <circle cx="180" cy="220" r="4" fill="#DC2625"/>
  <text x="180" y="210" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#DC2625" text-anchor="middle">Jérusalem</text>
  <circle cx="210" cy="240" r="3" fill="#D4A036"/>
  <text x="210" y="236" font-family="Inter, sans-serif" font-size="7" fill="#D4A036" text-anchor="middle">Jéricho</text>
  <circle cx="230" cy="190" r="3" fill="#D4A036"/>
  <text x="230" y="186" font-family="Inter, sans-serif" font-size="7" fill="#D4A036" text-anchor="middle">Samarie</text>
  <circle cx="150" cy="270" r="3" fill="#D4A036"/>
  <text x="150" y="266" font-family="Inter, sans-serif" font-size="7" fill="#D4A036" text-anchor="middle">Bethléem</text>
  <circle cx="240" cy="170" r="3" fill="#D4A036"/>
  <text x="240" y="166" font-family="Inter, sans-serif" font-size="7" fill="#D4A036" text-anchor="middle">Galilée</text>
  <!-- Lake of Galilee -->
  <ellipse cx="260" cy="175" rx="12" ry="8" fill="#3B82F6" opacity="0.3"/>
  <text x="275" y="178" font-family="Inter, sans-serif" font-size="5" fill="#3B82F6" opacity="0.5">Lac de Tibériade</text>

  <!-- Map controls -->
  <rect x="310" y="110" width="52" height="52" rx="8" fill="#FFF" opacity="0.8"/>
  <text x="336" y="130" font-family="Inter, sans-serif" font-size="16" fill="#1C1917" text-anchor="middle">+</text>
  <line x1="310" y1="136" x2="362" y2="136" stroke="#E8DDD0" stroke-width="0.5"/>
  <text x="336" y="154" font-family="Inter, sans-serif" font-size="16" fill="#1C1917" text-anchor="middle">−</text>

  <!-- Regions list -->
  <text x="30" y="390" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1C1917">Régions</text>

  <g transform="translate(16, 408)">
    <rect x="0" y="0" width="358" height="44" rx="10" fill="#FFF" opacity="0.7"/>
    <text x="46" y="28" font-family="Inter, sans-serif" font-size="12" fill="#1C1917">Judée</text>
    <text x="310" y="28" font-family="Inter, sans-serif" font-size="10" fill="#D4A036">8 sites →</text>

    <rect x="0" y="52" width="358" height="44" rx="10" fill="#FFF" opacity="0.7"/>
    <text x="46" y="80" font-family="Inter, sans-serif" font-size="12" fill="#1C1917">Galilée</text>
    <text x="310" y="80" font-family="Inter, sans-serif" font-size="10" fill="#D4A036">6 sites →</text>

    <rect x="0" y="104" width="358" height="44" rx="10" fill="#FFF" opacity="0.7"/>
    <text x="46" y="132" font-family="Inter, sans-serif" font-size="12" fill="#1C1917">Samarie</text>
    <text x="310" y="132" font-family="Inter, sans-serif" font-size="10" fill="#D4A036">4 sites →</text>

    <rect x="0" y="156" width="358" height="44" rx="10" fill="#FFF" opacity="0.7"/>
    <text x="46" y="184" font-family="Inter, sans-serif" font-size="12" fill="#1C1917">Pérée</text>
    <text x="310" y="184" font-family="Inter, sans-serif" font-size="10" fill="#D4A036">3 sites →</text>
  </g>

  <!-- Bottom nav -->
  <rect x="0" y="780" width="390" height="64" fill="#FDF8F0"/>
  <line x1="0" y1="780" x2="390" y2="780" stroke="#E8DDD0" stroke-width="0.5"/>
  <g font-family="Inter, sans-serif" font-size="9" fill="#78716C" text-anchor="middle">
    <text x="45" y="825">Accueil</text>
    <text x="120" y="825" fill="#D4A036" font-weight="600">Cartes</text>
    <text x="195" y="825">Noms</text>
    <text x="270" y="825">Scores</text>
    <text x="345" y="825">Réglages</text>
  </g>
  <circle cx="45" cy="810" r="3" fill="#D4D0C8"/>
  <circle cx="120" cy="810" r="3" fill="#D4A036"/>
  <circle cx="195" cy="810" r="3" fill="#D4D0C8"/>
  <circle cx="270" cy="810" r="3" fill="#D4D0C8"/>
  <circle cx="345" cy="810" r="3" fill="#D4D0C8"/>
  <rect x="130" y="830" width="130" height="4" rx="2" fill="#D4D0C8"/>
</svg>
