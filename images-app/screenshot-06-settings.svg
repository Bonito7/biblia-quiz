<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF8F0"/>
      <stop offset="100%" stop-color="#F0E6D6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A036"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- Status bar -->
  <text x="20" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1C1917">9:41</text>
  <rect x="340" y="18" width="16" height="8" rx="2" fill="none" stroke="#1C1917" stroke-width="0.6"/>
  <rect x="341" y="19" width="5" height="6" rx="1" fill="#1C1917"/>
  <rect x="354" y="19" width="8" height="6" rx="2" fill="#1C1917" opacity="0.4"/>
  <circle cx="330" cy="22" r="2.5" fill="#1C1917" opacity="0.4"/>

  <!-- Header with back -->
  <rect x="0" y="40" width="390" height="50" fill="#FDF8F0"/>
  <text x="16" y="70" font-family="Inter, sans-serif" font-size="16" fill="#1C1917" opacity="0.5">←</text>
  <text x="48" y="70" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1C1917">⚙️ Réglages</text>

  <!-- User profile -->
  <rect x="16" y="100" width="358" height="70" rx="12" fill="#FFF" opacity="0.7"/>
  <circle cx="50" cy="135" r="24" fill="url(#gold)"/>
  <text x="50" y="141" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#FFF" text-anchor="middle">JD</text>
  <text x="84" y="131" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1C1917">Jean Dupont</text>
  <text x="84" y="150" font-family="Inter, sans-serif" font-size="11" fill="#78716C">+225 07 00 00 00 00</text>
  <text x="330" y="135" font-family="Inter, sans-serif" font-size="18" fill="#D4D0C8">›</text>

  <!-- Settings items -->
  <g transform="translate(16, 190)">
    <!-- Dark mode -->
    <rect x="0" y="0" width="358" height="52" rx="12" fill="#FFF" opacity="0.7"/>
    <text x="46" y="30" font-family="Inter, sans-serif" font-size="13" fill="#1C1917">🌙 Mode sombre</text>
    <rect x="290" y="16" width="48" height="24" rx="12" fill="url(#gold)"/>
    <circle cx="330" cy="28" r="9" fill="#FFF"/>

    <!-- Notifications -->
    <rect x="0" y="60" width="358" height="52" rx="12" fill="#FFF" opacity="0.7"/>
    <text x="46" y="90" font-family="Inter, sans-serif" font-size="13" fill="#1C1917">🔔 Notifications</text>
    <rect x="290" y="76" width="48" height="24" rx="12" fill="#E8DDD0"/>
    <circle cx="306" cy="88" r="9" fill="#FFF"/>

    <!-- Language -->
    <rect x="0" y="120" width="358" height="52" rx="12" fill="#FFF" opacity="0.7"/>
    <text x="46" y="150" font-family="Inter, sans-serif" font-size="13" fill="#1C1917">🌐 Langue</text>
    <text x="310" y="150" font-family="Inter, sans-serif" font-size="12" fill="#D4A036">Français ›</text>

    <!-- Sound -->
    <rect x="0" y="180" width="358" height="52" rx="12" fill="#FFF" opacity="0.7"/>
    <text x="46" y="210" font-family="Inter, sans-serif" font-size="13" fill="#1C1917">🔊 Son</text>
    <rect x="290" y="196" width="48" height="24" rx="12" fill="url(#gold)"/>
    <circle cx="330" cy="208" r="9" fill="#FFF"/>

    <!-- Privacy -->
    <rect x="0" y="240" width="358" height="52" rx="12" fill="#FFF" opacity="0.7"/>
    <text x="46" y="270" font-family="Inter, sans-serif" font-size="13" fill="#1C1917">🔒 Règles de confidentialité</text>
    <text x="330" y="270" font-family="Inter, sans-serif" font-size="18" fill="#D4D0C8">›</text>
  </g>

  <!-- Danger zone -->
  <text x="30" y="490" font-family="Inter, sans-serif" font-size="11" fill="#DC2625" font-weight="600">ZONE DANGEREUSE</text>
  <line x1="30" y1="496" x2="360" y2="496" stroke="#DC2625" stroke-width="0.5" opacity="0.3"/>

  <g transform="translate(16, 508)">
    <rect x="0" y="0" width="358" height="52" rx="12" fill="#FFF" opacity="0.7"/>
    <text x="46" y="30" font-family="Inter, sans-serif" font-size="13" fill="#DC2625">🚪 Se déconnecter</text>

    <rect x="0" y="60" width="358" height="52" rx="12" fill="#FFF" opacity="0.7"/>
    <text x="46" y="90" font-family="Inter, sans-serif" font-size="13" fill="#DC2625">🗑️ Supprimer mon compte</text>
  </g>

  <!-- App info -->
  <text x="195" y="630" font-family="Inter, sans-serif" font-size="10" fill="#A38A5C" text-anchor="middle">Biblia-Quiz v1.0.0</text>

  <!-- Bottom nav -->
  <rect x="0" y="780" width="390" height="64" fill="#FDF8F0"/>
  <line x1="0" y1="780" x2="390" y2="780" stroke="#E8DDD0" stroke-width="0.5"/>
  <g font-family="Inter, sans-serif" font-size="9" fill="#78716C" text-anchor="middle">
    <text x="45" y="825">Accueil</text>
    <text x="120" y="825">Cartes</text>
    <text x="195" y="825">Noms</text>
    <text x="270" y="825">Scores</text>
    <text x="345" y="825" fill="#D4A036" font-weight="600">Réglages</text>
  </g>
  <circle cx="45" cy="810" r="3" fill="#D4D0C8"/>
  <circle cx="120" cy="810" r="3" fill="#D4D0C8"/>
  <circle cx="195" cy="810" r="3" fill="#D4D0C8"/>
  <circle cx="270" cy="810" r="3" fill="#D4D0C8"/>
  <circle cx="345" cy="810" r="3" fill="#D4A036"/>
  <rect x="130" y="830" width="130" height="4" rx="2" fill="#D4D0C8"/>
</svg>
